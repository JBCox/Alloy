# ============================================================================
# Alloy Configuration
# Multiple AIs, stronger together.
# ============================================================================

# Default AI to use when no @mention is specified
default_ai: claude

# Default judge AI for synthesis/verdict (empty = use default_ai)
default_judge: ""

# ============================================================================
# AI Definitions
# ============================================================================
# Each AI needs:
#   - command: CLI command (use {message} placeholder for the prompt)
#   - color: Display color for responses
#   - enabled: Set to false to disable
#   - description: Short description for help text
#
# Optional per-AI settings:
#   - timeout: Override global timeout (0 = use global)
#   - retry_count: Override global retry count
#   - weight: Voting weight for consensus (higher = more influence)
#   - fallback_ai: Backup AI to use if this one fails

ais:
  claude:
    command: "claude -p {message}"
    color: "cyan"
    enabled: true
    description: "Anthropic's Claude Code CLI"
    timeout: 0
    retry_count: 1           # Retry once on failure
    weight: 1
    fallback_ai: "gemini"    # Fall back to Gemini if Claude fails

  gemini:
    command: "gemini -p {message}"
    color: "blue"
    enabled: true
    description: "Google's Gemini CLI"
    timeout: 0
    retry_count: 1           # Retry once on failure
    weight: 1
    fallback_ai: "claude"    # Fall back to Claude if Gemini fails

  codex:
    command: "codex exec {message}"
    color: "green"
    enabled: true
    description: "OpenAI Codex CLI"
    timeout: 0
    retry_count: 1
    weight: 1
    fallback_ai: "claude"    # Fall back to Claude if Codex fails

  # GitHub Copilot CLI (install with: gh extension install github/gh-copilot)
  # copilot:
  #   command: "gh copilot suggest {message}"
  #   color: "magenta"
  #   enabled: false
  #   description: "GitHub Copilot CLI"

  # -------------------------------------------------------------------------
  # FREE AI Options
  # -------------------------------------------------------------------------

  # Ollama - 100% FREE, runs locally (https://ollama.ai)
  # Install: Download from ollama.ai, then run: ollama pull llama3.1
  ollama:
    command: "python wrappers/ollama_wrapper.py {message}"
    color: "yellow"
    enabled: false
    description: "Local AI via Ollama (FREE, unlimited)"
    timeout: 120
    retry_count: 1
    weight: 1
    fallback_ai: ""

  # Groq - FREE tier with generous limits (https://console.groq.com)
  # Blazing fast inference, great for quick queries
  groq:
    command: "python wrappers/groq_wrapper.py {message}"
    color: "red"
    enabled: false
    description: "Groq Cloud (FREE tier, very fast)"
    timeout: 60
    retry_count: 1
    weight: 1
    fallback_ai: ""

  # -------------------------------------------------------------------------
  # OpenCode Zen models (https://opencode.ai) - FREE tier needs NO API key
  # -------------------------------------------------------------------------
  # Install once:  npm install -g opencode-ai
  # List models:   opencode models
  # The "*-free" / preview models below work with zero credentials.
  #
  # NOTE: `--agent plan` = read-only (safe for discussion/review). Swap it for
  #       `--agent build` if you want this AI to actually edit files, like codex.
  # NOTE: opencode's --continue flag must come AFTER `run`, which Alloy's
  #       continue_flag insertion can't do - so leave continue_flag unset and
  #       Alloy will pass full conversation context in each prompt instead.

  # Ox Alpha - stealth model on OpenCode Zen: 1M context, multi-modal, free
  ox:
    command: "opencode run --agent plan -m opencode/x-preview-f-free {message}"
    color: "magenta"
    enabled: true
    description: "Ox Alpha via OpenCode Zen (FREE, 1M context)"
    timeout: 300
    retry_count: 1
    weight: 1
    fallback_ai: ""

  # Other free OpenCode Zen models - flip enabled: true to use them.
  # Heads-up: every enabled AI joins @all and the collaboration modes.
  pickle:
    command: "opencode run --agent plan -m opencode/big-pickle {message}"
    color: "yellow"
    enabled: false
    description: "Big Pickle via OpenCode Zen (FREE)"
    timeout: 300

  nemotron:
    command: "opencode run --agent plan -m opencode/nemotron-3-ultra-free {message}"
    color: "green"
    enabled: false
    description: "Nemotron 3 Ultra via OpenCode Zen (FREE)"
    timeout: 300

  nemotron-lite:
    command: "opencode run --agent plan -m opencode/nemotron-3.5-lightning-free {message}"
    color: "green"
    enabled: false
    description: "Nemotron 3.5 Lightning via OpenCode Zen (FREE, fast)"
    timeout: 300

  mimo:
    command: "opencode run --agent plan -m opencode/mimo-v2.5-free {message}"
    color: "blue"
    enabled: false
    description: "MiMo-V2.5 via OpenCode Zen (FREE)"
    timeout: 300

  hy3:
    command: "opencode run --agent plan -m opencode/hy3-free {message}"
    color: "red"
    enabled: false
    description: "Hy3 via OpenCode Zen (FREE)"
    timeout: 300

  muse:
    command: "opencode run --agent plan -m opencode/muse-spark-1.2-contributor-free {message}"
    color: "white"
    enabled: false
    description: "Muse Spark 1.2 via OpenCode Zen (FREE, contributor tier)"
    timeout: 300

  # Paid OpenCode Zen models need a key: run `opencode auth login` once.
  # Then any curated model works the same way, e.g.:
  # zen-gpt:
  #   command: "opencode run --agent plan -m opencode/gpt-5.6-sol {message}"
  #   color: "green"
  #   enabled: false
  #   description: "GPT-5.6 Sol via OpenCode Zen (paid)"

# ============================================================================
# Collaboration Modes
# ============================================================================
# Configure default behavior for each collaboration mode.
# Options: rounds, parallel, checkpoint

modes:
  roundtable:
    rounds: 1           # Each AI speaks once per round
    parallel: false

  chain:
    rounds: 3           # A -> B -> C sequential refinement
    parallel: false

  brainstorm:
    rounds: 1
    parallel: true      # Generate ideas simultaneously

  devils-advocate:
    rounds: 2           # Point and counterpoint exchanges
    parallel: false

  roles:
    rounds: 1
    parallel: false

  code-review:
    rounds: 1
    parallel: true      # Reviews generated in parallel

  solve:
    rounds: 3           # Understand -> Plan -> Implement
    parallel: false

  # Global mode settings (apply to all modes)
  global:
    satisfaction_threshold: 8   # Quality score for --until=satisfied (1-10)
    max_rounds: 10              # Safety cap on all mode iterations
    voting_system: majority     # majority, unanimous, or weighted

# ============================================================================
# Custom Role Templates
# ============================================================================
# Define custom role templates for @roles mode.
# Format: template_name: { roles: { role_name: description, ... } }
#
# Built-in templates: architecture, debate, review, research

custom_templates: {}
  # Example:
  # security:
  #   roles:
  #     attacker: "Find vulnerabilities and attack vectors"
  #     defender: "Design mitigations and security measures"
  #     auditor: "Evaluate the security posture objectively"

# ============================================================================
# Display Settings
# ============================================================================

display:
  # Show timestamps on each message
  show_timestamps: true

  # Show AI name header above each response
  show_ai_header: true

  # Max width for response text (0 = no limit)
  max_width: 120

  # Output verbosity: silent, normal, verbose, debug
  verbose_mode: normal

  # Number of characters to show in history preview
  preview_length: 100

# ============================================================================
# Context Settings
# ============================================================================

context:
  # Maximum messages to keep in conversation history
  max_history: 50

  # Auto-include last N messages as context (0 = disabled)
  auto_context: 0

  # Automatically save conversations to disk
  save_conversations: false

  # Directory for saved conversations (empty = current directory)
  save_path: ""

# ============================================================================
# Execution Settings
# ============================================================================

execution:
  # Stream output as it generates (show tokens in real-time)
  streaming: true

  # Enable parallel execution for @all and applicable modes
  parallel: false

  # Streaming display refresh rate (updates per second)
  refresh_rate: 10

  # Global timeout in seconds (per-AI query)
  timeout: 300

  # Maximum concurrent AI queries during parallel execution
  max_concurrent_ais: 3

  # Number of retry attempts on query failure
  retry_count: 0

  # Seconds to wait between retry attempts
  retry_delay: 2

# ============================================================================
# Smart AI Routing
# ============================================================================
# Assign specific AIs to task types. If not set, falls back to default_ai.
# This optimizes each phase by using the AI best suited for that task type.
#
# Example: Gemini has 2M context → great for analysis
#          Claude excels at code → use for implementation

routing:
  # Code review tasks
  code_review: ""

  # Research/analysis tasks (understanding, planning)
  analysis: ""

  # Code writing/implementation tasks
  implementation: ""

  # Creative/brainstorming tasks
  creative: ""

  # Judging/synthesis/verdict tasks
  judge: ""

# ============================================================================
# Legacy Settings (for backwards compatibility)
# ============================================================================

special_commands:
  debate_rounds: 3
  all_parallel: false

# ============================================================================
# Collaborative Model Builder
# ============================================================================
# Settings for `python main.py --build ...` (also `python -m builder`). Parsed
# leniently by builder/config.py; unknown keys are ignored. The chat modes above
# never read this section.

builder:
  # Where a project's workflow state (database, revisions, renders, logs) lives
  # when `new --workflow-dir` is not given. Empty = <project_dir>\alloy-builder\<slug>
  workflow_root: ""
  attended: true                        # attended by default; `start --unattended` opts out
  isolated_reviews: when_contaminated   # when_contaminated | always
  blender:
    executable: ""                      # empty = auto-detect C:\Program Files\Blender Foundation\Blender *\blender.exe
    deadlines: {validate: 120, apply: 600, render: 900, measure: 120, fixture: 300}
  agents:
    A: {provider: claude, model: fable, reasoning: max, executable: ""}
    B: {provider: codex, model: gpt-6-astra, reasoning: xhigh, executable: ""}
  provider_timeouts: {response: 900, inactivity: 180, cancel_probe_after: 8}   # seconds; cancel_probe_after = preflight --live cancellation probe
  limits: {wall_clock_minutes: 0, max_cost_usd: 0, max_requests: 0, max_renders: 0, attempts_per_finding: 2, stall_steps: 12}
  # Concept stage (addendum A). approval: each | anchor_only | auto (D11), shown by every `concept` verb.
  # max_images and max_regenerations_per_view count imported and generated images alike (R-105).
  concept:
    approval: each
    anchor_candidates: 4
    views: [front, side, rear, top, underside, three-quarter]
    max_images: 40
    max_regenerations_per_view: 3
    import_dir: ""                      # empty = <workflow>\concept\imports (used by the image-seat preflight)
  # The image seat I (D12): manual = the owner generates in the vendor's app from the prompt Alloy writes and runs
  # `concept import`; vendor and model are recorded as the owner declares them. No API key anywhere in this build.
  image_generation: {seat: manual, vendor: chatgpt, model: ""}
  presets:
    e10-bearer-head:
      name: "E10 Bearer - Head"
      project_dir: "C:\\Death Factory"
      asset: "E10 Bearer, the humanoid enemy"
      target_reference: "C:\\Death Factory\\docs\\art\\locked-theme-concept-v1.png"
      # The region is chosen by the user during an authorized run and never guessed.
      target_region: {name: "lower-left humanoid", bbox: null}
      existing_source: "C:\\Death Factory\\art-source\\blender\\E10\\E10_Bearer_v4_proportions.blend"
      existing_source_trust: "unfinished; proportions not assumed correct"
      first_component: "Head"
      rejected_references: []

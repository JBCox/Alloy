[pytest]
# The Collaborative Model Builder's suite is the only pytest suite in this repo. Everything else under
# tests/ is a standalone unittest script run by tests/run_all.py; never run `pytest tests` (it would
# execute those scripts' top-level code). The wrapper tests/test_builder_suite.py runs this suite for
# run_all.py and deselects `blender` and `live`; `python -m pytest tests/builder -m blender` is the
# real-Blender layer on its own.
testpaths = tests/builder
markers =
    blender: real-Blender test (layer B); skipped with a reason when Blender is absent
    cli: reads the installed provider CLIs locally (--version, --help); free; skipped when a CLI is absent
    live: real provider invocations (layer L); opt-in with ALLOY_LIVE=1 after owner approval; spends money
